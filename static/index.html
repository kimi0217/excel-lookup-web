<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excel 查詢</title>
<style>
  :root { --bg: #f7f7f8; --fg: #1f2328; --muted: #6b7280; --line: #d9dce1; --accent: #2563eb; --hit: #fde68a; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "PingFang TC", "Microsoft JhengHei", sans-serif; background: var(--bg); color: var(--fg); }
  header { padding: 16px; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; }
  h1 { margin: 0 0 12px; font-size: 20px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  select, input, button { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; }
  input { flex: 1; min-width: 200px; }
  button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
  main { padding: 16px; }
  #status { color: var(--muted); margin-bottom: 12px; }
  section { background: #fff; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
  section h2 { margin: 0; padding: 10px 12px; font-size: 15px; border-bottom: 1px solid var(--line); }
  section h2 small { color: var(--muted); font-weight: normal; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { background: #f1f2f4; }
  mark { background: var(--hit); }
  #notice { display: none; background: #fff7ed; border: 1px solid #fdba74; color: #9a3412; border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: 14px; }
  #notice ul { margin: 4px 0 0; padding-left: 20px; }
  option:disabled { color: #9ca3af; }
</style>
</head>
<body>
<header>
  <h1>Excel 查詢</h1>
  <form id="form">
    <select id="category"><option value="">全部分類</option></select>
    <input id="q" type="search" placeholder="輸入關鍵字…" autofocus>
    <button type="submit">搜尋</button>
  </form>
</header>
<main>
  <div id="status">請輸入關鍵字開始搜尋</div>
  <div id="notice"></div>
  <div id="results"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// 與後端搜尋規則一致:/ 與 - 視為相同、數字間可有千分位逗號
function highlightPattern(q) {
  const chars = [...escapeHtml(q)];
  return chars.map((c, i) => {
    const part = c === "/" || c === "-" ? "[/-]" : c.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return /\d/.test(c) && /\d/.test(chars[i + 1] || "") ? part + ",?" : part;
  }).join("");
}

function highlight(text, q) {
  const safe = escapeHtml(text);
  if (!q) return safe;
  return safe.replace(new RegExp(highlightPattern(q), "gi"), (m) => `<mark>${m}</mark>`);
}

const POLL_MS = 2000;
let pollTimer = null;
let lastQuery = null;  // 載入完成後自動重新搜尋用

function renderNotice(errors, loading) {
  const box = $("notice");
  const parts = [];
  if (loading.length) {
    parts.push(`資料載入中,以下檔案尚未載入完成,結果可能不完整(完成後會自動更新):<ul>` +
      loading.map((name) => `<li>${escapeHtml(name)}</li>`).join("") + "</ul>");
  }
  if (errors.length) {
    parts.push("以下檔案無法讀取,已略過:<ul>" +
      errors.map((e) => `<li>${escapeHtml(e.category)}:${escapeHtml(e.error)}</li>`).join("") + "</ul>");
  }
  box.innerHTML = parts.join("");
  box.style.display = parts.length ? "block" : "none";
}

async function loadCategories() {
  try {
    const res = await fetch("/api/categories");
    const cats = await res.json();
    const select = $("category");
    const current = select.value;
    select.length = 1;  // 保留「全部分類」
    for (const c of cats) {
      const opt = document.createElement("option");
      opt.value = c.name;
      opt.textContent = c.status === "error" ? `${c.name}(${c.error})`
        : c.status === "loading" ? `${c.name}(載入中)` : c.name;
      opt.disabled = c.status === "error";
      select.appendChild(opt);
    }
    if (cats.some((c) => c.name === current && c.status !== "error")) select.value = current;
    const loadingCount = cats.filter((c) => c.status === "loading").length;
    if (cats.length === 0) {
      $("status").textContent = "資料夾中沒有任何 Excel 檔案";
    } else if (loadingCount && lastQuery === null) {
      $("status").textContent = `資料載入中(${cats.length - loadingCount} / ${cats.length} 個檔案)…`;
    } else if (lastQuery === null) {
      $("status").textContent = "請輸入關鍵字開始搜尋";
    }
    schedulePoll(loadingCount > 0);
    return cats;
  } catch {
    $("status").textContent = "無法載入分類";
    return [];
  }
}

// 還有檔案在載入時定期更新狀態;全部載入完成後,若有搜尋過就自動重新搜尋
function schedulePoll(stillLoading) {
  clearTimeout(pollTimer);
  if (stillLoading) {
    pollTimer = setTimeout(loadCategories, POLL_MS);
  } else if (pollTimer !== null) {
    pollTimer = null;
    if (lastQuery) runSearch(lastQuery.q, lastQuery.category);
  }
}

async function doSearch(e) {
  e.preventDefault();
  const q = $("q").value.trim();
  if (!q) { $("status").textContent = "請輸入關鍵字"; $("results").innerHTML = ""; return; }
  await runSearch(q, $("category").value);
}

async function runSearch(q, category) {
  lastQuery = { q, category };
  $("status").textContent = "搜尋中…";
  const params = new URLSearchParams({ q });
  if (category) params.set("category", category);
  try {
    const res = await fetch(`/api/search?${params}`);
    if (!res.ok) throw new Error((await res.json()).detail || "搜尋失敗");
    const data = await res.json();
    render(data.results, q, data.loading);
    renderNotice(data.errors, data.loading);
    if (data.loading.length) schedulePoll(true);
  } catch (err) {
    $("status").textContent = `錯誤:${err.message}`;
    $("results").innerHTML = "";
  }
}

function render(groups, q, loading) {
  const total = groups.reduce((n, g) => n + g.rows.length, 0);
  $("status").textContent = total ? `共找到 ${total} 筆`
    : loading.length ? "資料載入中,請稍候…" : "查無資料";
  $("results").innerHTML = groups.map((g) => `
    <section>
      <h2>${escapeHtml(g.category)} <small>/ ${escapeHtml(g.sheet)}(${g.rows.length} 筆)</small></h2>
      <div class="scroll"><table>
        <thead><tr>${g.columns.map((c) => `<th>${escapeHtml(c)}</th>`).join("")}</tr></thead>
        <tbody>${g.rows.map((r) => `<tr>${r.map((v) => `<td>${highlight(v, q)}</td>`).join("")}</tr>`).join("")}</tbody>
      </table></div>
    </section>`).join("");
}

$("form").addEventListener("submit", doSearch);
loadCategories();
</script>
</body>
</html>
